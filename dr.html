<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>تطبيق المندوب</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'IBM Plex Sans Arabic'; background-color: #09090b; color: #fff; } .ultra-glass { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(24px); border: 1px solid rgba(255, 255, 255, 0.05); }</style>
</head>
<body class="p-4">
    <header class="ultra-glass p-4 rounded-2xl mb-6"><h1 class="text-xl font-bold text-orange-500">🛵 كابتن التوصيل</h1></header>

    <h2 class="font-bold mb-4 text-white/50">الطلبات الجاهزة للاستلام من المحلات:</h2>
    <div id="deliveries" class="space-y-4"></div>

    <script type="module">
        import { db } from './firebase-config.js';
        import { collection, query, where, onSnapshot, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const q = query(collection(db, "orders"), where("status", "==", "جاهز للتوصيل"));
        onSnapshot(q, (snap) => {
            const list = document.getElementById('deliveries');
            list.innerHTML = "";
            snap.forEach(docSnap => {
                const o = docSnap.data();
                list.innerHTML += `
                    <div class="ultra-glass p-4 rounded-2xl border-l-4 border-orange-500">
                        <p class="text-xs text-orange-400 mb-1">استلام من: ${o.shopName}</p>
                        <p class="font-bold">تسليم إلى: ${o.customerName} (${o.customerAddress})</p>
                        <p class="text-sm mb-3">الهاتف: ${o.customerPhone}</p>
                        <button onclick="deliver('${docSnap.id}')" class="w-full bg-orange-600 py-2 rounded-xl font-bold">تم التوصيل بنجاح ✅</button>
                    </div>
                `;
            });
        });

        window.deliver = async (id) => {
            await updateDoc(doc(db, "orders", id), { status: "تم التوصيل للزبون" });
        };
    </script>
</body>
</html>
