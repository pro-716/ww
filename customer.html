<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>متجر الزبون | LuxeStore</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'IBM Plex Sans Arabic'; background-color: #09090b; color: #fff; }
        .ultra-glass { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(24px); border: 1px solid rgba(255, 255, 255, 0.05); }
    </style>
</head>
<body class="relative min-h-screen">
    <div class="fixed inset-0 z-[-1] overflow-hidden"><div class="absolute top-[10%] left-[20%] w-[500px] h-[500px] bg-violet-600 rounded-full blur-[150px] opacity-30"></div></div>

    <!-- Login -->
    <div id="loginScreen" class="fixed inset-0 z-50 ultra-glass flex items-center justify-center">
        <div class="bg-[#09090b] p-8 rounded-3xl w-full max-w-sm border border-white/10">
            <h2 class="text-2xl font-bold mb-4">تسجيل الدخول للتسوق</h2>
            <input type="text" id="cName" placeholder="اسمك" class="w-full bg-white/5 p-3 rounded-xl mb-3 text-white">
            <input type="tel" id="cPhone" placeholder="رقم الهاتف" class="w-full bg-white/5 p-3 rounded-xl mb-4 text-white">
            <button onclick="login()" class="w-full bg-violet-600 py-3 rounded-xl font-bold">دخول</button>
        </div>
    </div>

    <!-- Cart -->
    <div id="cart" class="fixed top-0 left-0 w-80 h-full ultra-glass z-40 transform -translate-x-full transition-transform bg-[#09090b]/90 flex flex-col">
        <div class="p-6 border-b border-white/10 flex justify-between"><h2 class="font-bold">السلة</h2><button onclick="toggleCart()" class="text-xl">&times;</button></div>
        <div id="cartItems" class="flex-1 p-4 overflow-y-auto"></div>
        <div class="p-6 border-t border-white/10">
            <p class="mb-4">المجموع: <span id="cartTotal" class="text-fuchsia-400 font-bold">0</span> د.ع</p>
            <button onclick="checkout()" class="w-full bg-emerald-600 py-3 rounded-xl font-bold">تأكيد الطلب</button>
        </div>
    </div>

    <!-- Navbar -->
    <nav class="ultra-glass p-4 m-4 rounded-2xl flex justify-between items-center sticky top-4 z-30">
        <h1 class="text-2xl font-bold">LUXE<span class="text-fuchsia-500">STORE</span></h1>
        <button onclick="toggleCart()" class="bg-white/10 px-4 py-2 rounded-full relative">🛒 السلة <span id="cartCount" class="absolute -top-2 -right-2 bg-fuchsia-500 rounded-full w-5 h-5 text-xs flex items-center justify-center">0</span></button>
    </nav>

    <!-- Products -->
    <div id="productsGrid" class="grid grid-cols-2 md:grid-cols-4 gap-4 p-4 max-w-7xl mx-auto pb-20"></div>

    <script type="module">
        import { db } from './firebase-config.js';
        import { collection, getDocs, addDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        let customer = {};
        let cart = [];

        window.login = () => {
            const name = document.getElementById('cName').value;
            const phone = document.getElementById('cPhone').value;
            if(!name || !phone) return alert("أدخل البيانات");
            customer = { name, phone };
            document.getElementById('loginScreen').classList.add('hidden');
            loadProducts();
        };

        async function loadProducts() {
            const grid = document.getElementById('productsGrid');
            const snap = await getDocs(collection(db, "products"));
            grid.innerHTML = '';
            snap.forEach(doc => {
                const p = doc.data();
                const pData = encodeURIComponent(JSON.stringify(p));
                grid.innerHTML += `
                    <div class="ultra-glass p-3 rounded-2xl">
                        <img src="${p.image}" class="w-full h-48 object-cover rounded-xl mb-2">
                        <h3 class="font-bold">${p.name}</h3>
                        <p class="text-[10px] text-emerald-400 mb-2">متجر: ${p.shopName}</p>
                        <div class="flex justify-between items-center">
                            <span class="text-fuchsia-400 font-bold">${p.price} د.ع</span>
                            <button onclick="addToCart('${pData}')" class="bg-white/10 px-3 py-1 rounded-full text-sm">أضف</button>
                        </div>
                    </div>
                `;
            });
        }

        window.toggleCart = () => document.getElementById('cart').classList.toggle('-translate-x-full');
        
        window.addToCart = (data) => {
            cart.push(JSON.parse(decodeURIComponent(data)));
            updateCart();
        };

        function updateCart() {
            document.getElementById('cartCount').innerText = cart.length;
            let total = 0;
            document.getElementById('cartItems').innerHTML = cart.map(p => {
                total += Number(p.price);
                return `<div class="bg-white/5 p-2 rounded mb-2 text-sm"><p>${p.name}</p><p class="text-fuchsia-400">${p.price}</p></div>`;
            }).join('');
            document.getElementById('cartTotal').innerText = total;
        }

        window.checkout = async () => {
            if(cart.length === 0) return;
            const address = prompt("أدخل عنوان التوصيل بالتفصيل:");
            if(!address) return;

            // تقسيم الطلبات حسب اسم المحل!
            const ordersByShop = {};
            cart.forEach(item => {
                if(!ordersByShop[item.shopName]) ordersByShop[item.shopName] = [];
                ordersByShop[item.shopName].push(item);
            });

            for (let shop in ordersByShop) {
                await addDoc(collection(db, "orders"), {
                    shopName: shop,
                    customerName: customer.name,
                    customerPhone: customer.phone,
                    customerAddress: address,
                    items: ordersByShop[shop],
                    status: "قيد التجهيز", // حالة للتاجر
                    date: new Date()
                });
            }
            alert("تم إرسال طلباتك للتجار بنجاح!");
            cart = []; updateCart(); toggleCart();
        };
    </script>
</body>
</html>
