<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>الإدارة المركزية</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'IBM Plex Sans Arabic'; background-color: #09090b; color: #fff; } .ultra-glass { background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.05); }</style>
</head>
<body class="p-8">
    <h1 class="text-3xl font-bold mb-8 text-sky-400">لوحة تحكم المدير العام (Root)</h1>
    
    <div class="grid grid-cols-2 gap-6">
        <!-- جميع الطلبات -->
        <div class="ultra-glass p-6 rounded-3xl">
            <h2 class="font-bold mb-4">حالة جميع الطلبات اللحظية</h2>
            <div id="allOrders" class="space-y-2 text-sm"></div>
        </div>
        <!-- جميع المنتجات -->
        <div class="ultra-glass p-6 rounded-3xl">
            <h2 class="font-bold mb-4">المنتجات المعروضة بالسوق</h2>
            <div id="allProducts" class="space-y-2 text-sm"></div>
        </div>
    </div>

    <script type="module">
        import { db } from './firebase-config.js';
        import { collection, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // مراقبة الطلبات
        onSnapshot(collection(db, "orders"), (snap) => {
            const list = document.getElementById('allOrders');
            list.innerHTML = "";
            snap.forEach(d => {
                const o = d.data();
                let color = o.status === 'تم التوصيل للزبون' ? 'text-emerald-400' : 'text-yellow-400';
                list.innerHTML += `<div class="bg-white/5 p-2 rounded flex justify-between"><span>زبون: ${o.customerName} | محل: ${o.shopName}</span> <span class="${color} font-bold">${o.status}</span></div>`;
            });
        });

        // مراقبة المنتجات
        onSnapshot(collection(db, "products"), (snap) => {
            const list = document.getElementById('allProducts');
            list.innerHTML = "";
            snap.forEach(d => {
                const p = d.data();
                list.innerHTML += `<div class="bg-white/5 p-2 rounded flex justify-between"><span>${p.name} (${p.price} د.ع)</span> <span class="text-fuchsia-400">${p.shopName}</span></div>`;
            });
        });
    </script>
</body>
</html>
