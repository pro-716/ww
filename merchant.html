<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>لوحة التاجر</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'IBM Plex Sans Arabic'; background-color: #09090b; color: #fff; } .ultra-glass { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(24px); border: 1px solid rgba(255, 255, 255, 0.05); }</style>
</head>
<body class="p-4">
    <!-- Login -->
    <div id="login" class="ultra-glass p-8 max-w-sm mx-auto mt-20 rounded-3xl text-center">
        <h2 class="text-xl font-bold mb-4">تسجيل متجرك</h2>
        <input type="text" id="shopName" placeholder="اسم محلك (يجب أن يكون دقيقاً)" class="w-full bg-white/5 p-3 rounded-xl mb-4 text-white text-center">
        <button onclick="startShop()" class="w-full bg-violet-600 py-3 rounded-xl font-bold">دخول</button>
    </div>

    <!-- Dashboard -->
    <div id="dash" class="hidden max-w-5xl mx-auto space-y-6">
        <h1 class="text-2xl font-bold">مرحباً، <span id="sTitle" class="text-fuchsia-400"></span></h1>
        
        <div class="grid md:grid-cols-2 gap-6">
            <!-- رفع منتج -->
            <div class="ultra-glass p-6 rounded-3xl">
                <h2 class="font-bold mb-4 text-emerald-400">رفع منتج جديد</h2>
                <input type="text" id="pName" placeholder="اسم المنتج" class="w-full bg-white/5 p-3 rounded-xl mb-3">
                <input type="number" id="pPrice" placeholder="السعر" class="w-full bg-white/5 p-3 rounded-xl mb-3">
                <input type="file" id="pImage" class="w-full bg-white/5 p-2 rounded-xl mb-4">
                <button id="uploadBtn" class="w-full bg-emerald-600 py-3 rounded-xl font-bold">نشر المنتج</button>
            </div>

            <!-- الطلبات الواردة للتاجر -->
            <div class="ultra-glass p-6 rounded-3xl border border-fuchsia-500/30">
                <h2 class="font-bold mb-4 text-fuchsia-400">طلبات الزبائن الجديدة 📦</h2>
                <div id="orders" class="space-y-4 max-h-96 overflow-y-auto"></div>
            </div>
        </div>
    </div>

    <script type="module">
        import { db, storage } from './firebase-config.js';
        import { collection, addDoc, query, where, onSnapshot, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-storage.js";

        let currentShop = "";

        window.startShop = () => {
            currentShop = document.getElementById('shopName').value;
            if(!currentShop) return;
            document.getElementById('login').classList.add('hidden');
            document.getElementById('dash').classList.remove('hidden');
            document.getElementById('sTitle').innerText = currentShop;
            listenToOrders();
        };

        // رفع المنتج
        document.getElementById('uploadBtn').onclick = async () => {
            const name = document.getElementById('pName').value;
            const price = document.getElementById('pPrice').value;
            const file = document.getElementById('pImage').files[0];
            const btn = document.getElementById('uploadBtn');

            if(!name || !price || !file) return alert("أكمل البيانات");
            btn.innerText = "جاري الرفع...";
            btn.disabled = true;

            const imgRef = ref(storage, `products/${Date.now()}_${file.name}`);
            await uploadBytes(imgRef, file);
            const url = await getDownloadURL(imgRef);

            await addDoc(collection(db, "products"), { name, price, image: url, shopName: currentShop });
            alert("تم النشر للزبائن!");
            btn.innerText = "نشر المنتج"; btn.disabled = false;
        };

        // قراءة طلبات هذا المحل فقط
        function listenToOrders() {
            const q = query(collection(db, "orders"), where("shopName", "==", currentShop));
            onSnapshot(q, (snap) => {
                const list = document.getElementById('orders');
                list.innerHTML = "";
                snap.forEach(docSnap => {
                    const o = docSnap.data();
                    if(o.status === 'قيد التجهيز') {
                        list.innerHTML += `
                            <div class="bg-white/5 p-4 rounded-xl">
                                <p class="font-bold text-sm">الزبون: ${o.customerName} | 📞 ${o.customerPhone}</p>
                                <p class="text-xs text-white/50 mb-2">📍 ${o.customerAddress}</p>
                                <div class="text-xs text-emerald-400 mb-2">المنتجات: ${o.items.map(i=>i.name).join(', ')}</div>
                                <button onclick="markReady('${docSnap.id}')" class="w-full bg-blue-600 py-1 rounded text-sm font-bold">تأكيد: جاهز للمندوب</button>
                            </div>
                        `;
                    }
                });
            });
        }

        window.markReady = async (id) => {
            await updateDoc(doc(db, "orders", id), { status: "جاهز للتوصيل" });
        };
    </script>
</body>
</html>
